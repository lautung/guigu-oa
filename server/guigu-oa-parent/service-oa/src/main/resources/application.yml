spring:
  application:
    name: service-oa
  profiles:
    active: dev

guigu:
  oa:
    # Bind this directory to persistent storage in containers; template paths are relative to it.
    process-definition-dir: ${GUIGU_OA_PROCESS_DEFINITION_DIR:./data/process-definitions}

# 接口文档是本地开发工具，不是匿名可访问的产品面（#140）：默认关闭，只有
# application-dev.yml 显式打开，新 profile 不会意外暴露端点、参数与数据模型。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
    json:
      # 手机号打码在结构化输出层统一完成（ADR 0039）：message 与 stack_trace 经
      # PhoneNumberMasker 渲染成 138****1234，覆盖所有 logger，含异常栈里的 rejected value。
      customizer: com.atguigu.common.observability.PhoneNumberMaskingCustomizer
