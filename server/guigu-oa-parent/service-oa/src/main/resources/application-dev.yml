server:
  port: 8800
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath:com/atguigu/*/mapper/xml/*.xml

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/guigu-oa?serverTimezone=GMT%2B8&useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 1800000
    password:
    jedis:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 5
        min-idle: 0

guigu:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-not-for-production-00000000000000000000000000000000}
  oa:
    attachments:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:guigu-oa-attachments}
      access-key: ${S3_ACCESS_KEY:local-access-key}
      secret-key: ${S3_SECRET_KEY:local-secret-key}
      upload-url-ttl: ${S3_UPLOAD_URL_TTL:PT5M}
      download-url-ttl: ${S3_DOWNLOAD_URL_TTL:PT15M}
      pending-ttl: ${S3_PENDING_TTL:PT24H}
      cleanup-interval: ${S3_CLEANUP_INTERVAL:PT1H}
      max-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:52428800}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

flowable:
  database-schema-update: true
  db-history-used: true
  history-level: full
  check-process-definitions: false

# 切库后再部署已发布模板（不改模板状态）：启动时加 --guigu.oa.cutover.redeploy-published=true
