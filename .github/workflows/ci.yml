name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            server/guigu-oa-parent/pom.xml
            server/guigu-oa-parent/**/pom.xml
      - name: Run backend tests
        run: mvn -B -f server/guigu-oa-parent/pom.xml test
      - name: Package backend image artifact
        run: mvn -B -f server/guigu-oa-parent/pom.xml -DskipTests package
      - name: Build backend image
        run: docker build --file server/guigu-oa-parent/service-oa/Dockerfile --tag guigu-oa-service-oa:ci server/guigu-oa-parent

  frontend:
    name: Frontend quality, smoke tests, and image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/guigu-oa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: client/guigu-oa-client/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npm run test:e2e
      - name: Build frontend
        run: npm run build:prod
      - name: Build frontend image
        run: docker build --file Dockerfile --tag guigu-oa-client:ci .
