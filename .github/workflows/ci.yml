name: CI

on:
  pull_request:
    # ready_for_review 不在默认类型里：draft 期间的 synchronize 由 job 级 if 跳过，
    # 转正那一刻靠这个类型触发（ADR 0070）。
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# 同一 ref 连推只保留最新一次；PR 分支同理。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and package
    # draft PR 不付门禁成本；转正（ready_for_review）与转正后的 synchronize 照跑（ADR 0070）。
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            server/lautung-oa-parent/pom.xml
            server/lautung-oa-parent/**/pom.xml
      - name: Run backend tests
        id: backend-tests
        run: mvn -B -f server/lautung-oa-parent/pom.xml test
      - name: Report backend coverage
        if: always()
        continue-on-error: true
        run: node scripts/coverage-summary.mjs --backend --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/lautung-oa-parent/lautung-oa-coverage-report/target/site/jacoco-aggregate
          retention-days: 14
      - name: Assert backend coverage report
        if: always() && steps.backend-tests.outcome == 'success'
        run: test -s server/lautung-oa-parent/lautung-oa-coverage-report/target/site/jacoco-aggregate/jacoco.csv
      - name: Package backend
        run: mvn -B -f server/lautung-oa-parent/pom.xml -DskipTests package

  frontend:
    name: Frontend quality, smoke tests, and build
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/guigu-oa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: client/guigu-oa-client/package-lock.json
      - run: npm ci
      - name: Verify frontend
        id: frontend-verify
        run: npm run verify:ci
      - name: Report frontend coverage
        if: always()
        continue-on-error: true
        run: node ../../scripts/coverage-summary.mjs --frontend --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/guigu-oa-client/coverage
          retention-days: 14
      - name: Assert frontend coverage report
        if: always() && steps.frontend-verify.outcome == 'success'
        run: test -s coverage/coverage-summary.json
      # PR 门禁只跑 Chromium 两档；WebKit 留给兼容性矩阵，不在这里装（ADR 0070）。
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npx playwright test --project=desktop-chromium --project=mobile-chromium
      - name: Build frontend
        run: npm run build:prod
