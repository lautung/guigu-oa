name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            server/guigu-oa-parent/pom.xml
            server/guigu-oa-parent/**/pom.xml
      - name: Run backend tests
        id: backend-tests
        run: mvn -B -f server/guigu-oa-parent/pom.xml test
      - name: Report backend coverage
        if: always()
        continue-on-error: true
        run: node scripts/coverage-summary.mjs --backend --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/guigu-oa-parent/coverage-report/target/site/jacoco-aggregate
          retention-days: 14
      - name: Assert backend coverage report
        if: always() && steps.backend-tests.outcome == 'success'
        run: test -s server/guigu-oa-parent/coverage-report/target/site/jacoco-aggregate/jacoco.csv
      - name: Package backend image artifact
        run: mvn -B -f server/guigu-oa-parent/pom.xml -DskipTests package
      - name: Build backend image
        run: docker build --file server/guigu-oa-parent/service-oa/Dockerfile --tag guigu-oa-service-oa:ci server/guigu-oa-parent

  frontend:
    name: Frontend quality, smoke tests, and image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client/guigu-oa-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: client/guigu-oa-client/package-lock.json
      - run: npm ci
      - name: Verify frontend
        id: frontend-verify
        run: npm run verify
      - name: Collect frontend coverage
        if: always()
        continue-on-error: true
        run: npm run coverage
      - name: Report frontend coverage
        if: always()
        continue-on-error: true
        run: node ../../scripts/coverage-summary.mjs --frontend --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frontend coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/guigu-oa-client/coverage
          retention-days: 14
      - name: Assert frontend coverage report
        if: always() && steps.frontend-verify.outcome == 'success'
        run: test -s coverage/coverage-summary.json
      # WebKit 是兼容性矩阵的备选引擎（#114/#117）。矩阵是否每次 PR 都跑仍待定
      # （地图「五类测试是否接入 CI 门禁」），所以 PR 门禁继续只跑 Chromium 两档。
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright smoke tests
        run: npx playwright test --project=desktop-chromium --project=mobile-chromium
      - name: Build frontend
        run: npm run build:prod
      - name: Build frontend image
        run: docker build --file Dockerfile --tag guigu-oa-client:ci .
