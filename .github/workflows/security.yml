name: Security regression

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-regression
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security suite (61 cases, ZAP passive, stored XSS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: client/guigu-oa-client/package-lock.json
      - run: npm ci
        working-directory: client/guigu-oa-client
      - run: npx playwright install --with-deps chromium
        working-directory: client/guigu-oa-client
      - name: Install ZAP 2.17.0 Core
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zap.zip" \
            https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Core.zip
          unzip -q "$RUNNER_TEMP/zap.zip" -d "$RUNNER_TEMP/zap"
          chmod +x "$RUNNER_TEMP/zap/ZAP_2.17.0/zap.sh"
          test -x "$RUNNER_TEMP/zap/ZAP_2.17.0/zap.sh"
      # ADR 0030：每周一 03:00 UTC 跑安全整轮；routine 证据只进 artifact。
      - name: Run security regression
        env:
          OUT: ${{ runner.temp }}/test-evidence
          ZAP_HOME: ${{ runner.temp }}/zap/ZAP_2.17.0
          # 无 DISPLAY 的 runner 上让 ZAP 以 headless 启动。
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: ./scripts/test-round.sh ci-security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-regression-evidence
          path: ${{ runner.temp }}/test-evidence
          retention-days: 14
          if-no-files-found: warn
